<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="description" content="Interactive 3D globe for keeping notes about countries" />
        <title>WorldNotes</title>
        <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%231d5fe0' stroke-width='2'%3E%3Ccircle cx='12' cy='12' r='10'/%3E%3Cpath d='M2 12h20M12 2a15 15 0 0 1 0 20M12 2a15 15 0 0 0 0 20'/%3E%3C/svg%3E" />
        <script>
            try {
                const saved = JSON.parse(localStorage.getItem("worldnotes"))?.settings?.theme;
                document.documentElement.dataset.theme = saved || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
            } catch {
                document.documentElement.dataset.theme = "dark";
            }
        </script>
    </head>
    <body>
        <div id="globe"></div>

        <div class="loader" id="loader">
            <div class="loader-spinner"></div>
            <span>Loading the world…</span>
        </div>

        <header class="topbar">
            <div class="brand">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="10" /><path d="M2 12h20M12 2a15 15 0 0 1 0 20M12 2a15 15 0 0 0 0 20" /></svg>
                <span>WorldNotes</span>
            </div>

            <div class="search">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7" /><path d="m20 20-3.5-3.5" /></svg>
                <input id="search" type="search" placeholder="Find a country" autocomplete="off" spellcheck="false" />
                <ul class="search-results" id="search-results" hidden></ul>
            </div>

            <div class="actions">
                <button class="icon-button" id="import" title="Import JSON" aria-label="Import JSON">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5M5 21h14" /></svg>
                </button>
                <button class="icon-button" id="export" title="Export JSON" aria-label="Export JSON">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3M7 8l5-5 5 5M5 21h14" /></svg>
                </button>
                <button class="icon-button" id="theme" title="Toggle theme" aria-label="Toggle theme">
                    <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4" /><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" /></svg>
                    <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" /></svg>
                </button>
                <input id="import-file" type="file" accept="application/json,.json" hidden />
            </div>
        </header>

        <div class="zoom-controls">
            <button class="icon-button" id="zoom-in" title="Zoom in" aria-label="Zoom in">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14" /></svg>
            </button>
            <button class="icon-button" id="zoom-out" title="Zoom out" aria-label="Zoom out">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14" /></svg>
            </button>
            <button class="icon-button" id="zoom-reset" title="Reset view" aria-label="Reset view">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8" /><path d="M3 3v5h5" /></svg>
            </button>
        </div>

        <div class="stats" id="stats"></div>

        <aside class="panel" id="panel" aria-hidden="true">
            <div class="panel-header">
                <div>
                    <span class="panel-label">Country</span>
                    <h2 id="panel-title"></h2>
                </div>
                <button class="icon-button" id="panel-close" title="Close" aria-label="Close panel">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18" /></svg>
                </button>
            </div>

            <section class="panel-section">
                <div class="section-head">
                    <h3>Surface color</h3>
                    <button class="text-button" id="color-reset">Reset</button>
                </div>
                <div class="swatches" id="swatches"></div>
            </section>

            <section class="panel-section panel-grow">
                <div class="section-head">
                    <h3>Note</h3>
                    <span class="save-status" id="save-status"></span>
                </div>
                <textarea id="note" placeholder="Write something about this country…"></textarea>
            </section>

            <div class="panel-footer">
                <span class="updated" id="updated"></span>
                <button class="text-button danger" id="entry-clear">Clear all</button>
            </div>
        </aside>

        <div class="globe-tooltip" id="tooltip" hidden></div>

        <div class="toasts" id="toasts"></div>

        <script type="module" src="/src/main.js"></script>
    </body>
</html>
